services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: file_explorer
    volumes: ["dbdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d file_explorer"]
      interval: 3s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    environment:
      FX_MASTER_KEY: ${FX_MASTER_KEY:-}   # hors base : sans elle, les colonnes confidentielles sont indisponibles
      DATABASE_URL: postgresql+psycopg2://app:app@db:5432/file_explorer
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]
volumes:
  dbdata:
