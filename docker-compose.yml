services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: file_explorer
    volumes: ["dbdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d file_explorer"]
      interval: 3s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    environment:
      FX_MASTER_KEY: ${FX_MASTER_KEY:-}   # hors base : sans elle, les colonnes confidentielles sont indisponibles
      FX_CORS_ORIGINS: ${FX_CORS_ORIGINS:-*}
      FX_MAX_UPLOAD_MB: ${FX_MAX_UPLOAD_MB:-200}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/file_explorer
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    depends_on: [backend]
volumes:
  dbdata:
