name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:

# Une nouvelle poussée sur la même branche annule la précédente : sans ça, une
# série de corrections successives fait la queue pendant que seul le dernier
# résultat compte.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Le lint passe avant les tests, et seul ──────────────────────────────
  # Il dure une dizaine de secondes et échoue sur des motifs qu'aucun test ne
  # verra jamais (import mort, `except:` nu, `== None`). Le placer en job
  # séparé donne un retour immédiat sans attendre Postgres.
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  # ── Les deux bases en une matrice ───────────────────────────────────────
  # Les deux jobs backend étaient identiques à une variable d'environnement
  # près : deux copies à maintenir en parallèle, donc deux occasions de les
  # laisser diverger.
  backend:
    name: Backend (${{ matrix.db }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false          # savoir si ça casse sur *les deux* bases ou une seule
      matrix:
        include:
          - db: sqlite
            fx_db_url: ""
          - db: postgres
            fx_db_url: postgresql+psycopg2://app:app@localhost:5432/fx_test
    # Le service tourne pour les deux entrées de la matrice. Le rendre
    # conditionnel demanderait une `image` vide côté SQLite, ce que le
    # runner refuse — et un conteneur Postgres inutilisé coûte quelques
    # secondes, moins qu'un job qui ne démarre pas.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: fx_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"                            # ~1 min gagnée par job
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
        env:
          FX_DB_URL: ${{ matrix.fx_db_url }}

  frontend:
    name: Frontend build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build          # `tsc -b` compris : le typage est vérifié ici
      - run: npm test

  # ── Ce que les tests ne voient pas ──────────────────────────────────────
  # Un Dockerfile cassé passe toute la CI actuelle sans un bruit, et ne se
  # découvre qu'au déploiement. Construire les deux images est le seul moyen
  # de savoir que `docker compose up --build` marche encore.
  images:
    name: Build des images Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
